# =======================================================
# Test Data Management with Docker
# Manages isolated test database & pre-seeded test data
# =======================================================
services:
  test-db:
    image: postgres:16-alpine
    container_name: ecommerce-test-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ecommerce_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    volumes:
      # Automatically initialize test tables and seed baseline test datasets
      - ./docker/init-test-data.sql:/docker-entrypoint-initdb.d/init-test-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d ecommerce_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
